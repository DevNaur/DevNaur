<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMetrics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0e0d1f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="neonBorderMetrics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="metricCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#0c0b17"/>
    </linearGradient>

    <linearGradient id="langBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="40%" stop-color="#3776ab"/>
      <stop offset="70%" stop-color="#f7df1e"/>
      <stop offset="90%" stop-color="#e34f26"/>
      <stop offset="100%" stop-color="#4eaa25"/>
    </linearGradient>

    <filter id="metricsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8a2be2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-sec { font-weight: 800; font-size: 22px; letter-spacing: 2px; }
    .box-title { font-weight: 700; font-size: 13.5px; letter-spacing: 1.5px; }
    .stat-number { font-weight: 800; font-size: 28px; font-family: 'Fira Code', monospace; }
    .stat-label { font-size: 11px; fill: #94a3b8; font-family: 'Fira Code', monospace; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect x="5" y="5" width="940" height="420" rx="14" fill="url(#bgGradMetrics)"/>
  <rect x="5" y="5" width="940" height="420" rx="14" fill="none" stroke="url(#neonBorderMetrics)" stroke-width="1.8" filter="url(#metricsGlow)"/>

  <!-- Section Header -->
  <g transform="translate(30, 42)">
    <text x="0" y="0" fill="#00f5d4" class="font-mono title-sec">05 // ESTATÍSTICAS DO GITHUB <tspan fill="#94a3b8" font-size="16">(GITHUB METRICS)</tspan></text>
    <path d="M 860 -15 L 875 -15 M 880 -15 L 895 -15" stroke="#bd00ff" stroke-width="3"/>
  </g>

  <!-- ==================== LEFT BOX: MOST USED LANGUAGES ==================== -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="435" height="235" rx="8" fill="url(#metricCardBg)" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Titlebar with 3 dots -->
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#0c4a6e" fill-opacity="0.25"/>
    <circle cx="15" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="41" cy="14" r="4.5" fill="#10b981"/>
    <text x="60" y="18" fill="#38bdf8" class="font-mono box-title">MOST USED LANGUAGES</text>

    <!-- Progress Bar Cyber Glow -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="385" height="14" rx="7" fill="#1e293b"/>
      <!-- Multi-gradient bar -->
      <rect x="0" y="0" width="160" rx="7" height="14" fill="#3178c6"/> <!-- TS -->
      <rect x="162" y="0" width="115" height="14" fill="#3776ab"/> <!-- Python -->
      <rect x="279" y="0" width="55" height="14" fill="#f7df1e"/> <!-- JS -->
      <rect x="336" y="0" width="49" rx="7" height="14" fill="#e34f26"/> <!-- HTML/CSS -->
    </g>

    <!-- 3 Circular Gauges -->
    <!-- Gauge 1: TypeScript -->
    <g transform="translate(75, 145)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#3178c6" stroke-width="6" stroke-dasharray="140 200" stroke-linecap="round"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">42%</text>
      <text x="0" y="48" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="12" font-weight="600">TypeScript</text>
    </g>

    <!-- Gauge 2: Python / Django -->
    <g transform="translate(215, 145)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#3776ab" stroke-width="6" stroke-dasharray="100 200" stroke-linecap="round"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">30%</text>
      <text x="0" y="48" text-anchor="middle" fill="#ffd43b" class="font-mono" font-size="12" font-weight="600">Python</text>
    </g>

    <!-- Gauge 3: JavaScript / Web -->
    <g transform="translate(355, 145)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#f7df1e" stroke-width="6" stroke-dasharray="80 200" stroke-linecap="round"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="14" font-weight="700">28%</text>
      <text x="0" y="48" text-anchor="middle" fill="#f7df1e" class="font-mono" font-size="12" font-weight="600">JS / Web</text>
    </g>
  </g>

  <!-- ==================== RIGHT BOX: CONTRIBUTIONS & TELEMETRY ==================== -->
  <g transform="translate(485, 70)">
    <rect x="0" y="0" width="435" height="235" rx="8" fill="url(#metricCardBg)" stroke="#00f5d4" stroke-width="1.2"/>
    <!-- Titlebar with 3 dots -->
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#042f2e" fill-opacity="0.3"/>
    <circle cx="15" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="41" cy="14" r="4.5" fill="#10b981"/>
    <text x="60" y="18" fill="#00f5d4" class="font-mono box-title">CONTRIBUTIONS &amp; ACTIVITY</text>

    <!-- 3 Activity Rings -->
    <!-- Metric 1: Total Contributions -->
    <g transform="translate(75, 115)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#1e293b" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#00f5d4" stroke-width="5" stroke-dasharray="160 220" stroke-linecap="round"/>
      <text x="0" y="8" text-anchor="middle" fill="#00f5d4" class="stat-number">65+</text>
      <text x="0" y="52" text-anchor="middle" class="stat-label">CONTRIBUTIONS</text>
    </g>

    <!-- Metric 2: Repositories -->
    <g transform="translate(215, 115)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#1e293b" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#bd00ff" stroke-width="5" stroke-dasharray="120 220" stroke-linecap="round"/>
      <text x="0" y="8" text-anchor="middle" fill="#bd00ff" class="stat-number">10+</text>
      <text x="0" y="52" text-anchor="middle" class="stat-label">REPOSITÓRIOS</text>
    </g>

    <!-- Metric 3: System Integrity -->
    <g transform="translate(355, 115)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#1e293b" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="214 220" stroke-linecap="round"/>
      <text x="0" y="8" text-anchor="middle" fill="#10b981" class="stat-number">100%</text>
      <text x="0" y="52" text-anchor="middle" class="stat-label">CODE INTEGRITY</text>
    </g>

    <!-- Bottom Status Note -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="395" height="26" rx="5" fill="#0f172a"/>
      <text x="197" y="17" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="11">
        TELEMETRIA: <tspan fill="#10b981">CI/CD PASSING</tspan> ● ZERO VULNERABILITIES DETECTED
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM HUD: QUOTE & CTA ==================== -->
  <g transform="translate(30, 320)">
    <rect x="0" y="0" width="890" height="85" rx="8" fill="#13112a" stroke="#8a2be2" stroke-width="1.2"/>
    <text x="445" y="32" text-anchor="middle" fill="#f1f5f9" class="font-sans" font-size="14" font-weight="600" font-style="italic">
      "Security is not a product, but a process." — Bruce Schneier
    </text>
    <text x="445" y="60" text-anchor="middle" fill="#00f5d4" class="font-mono" font-size="13" font-weight="700">
      ACCESS / CONNECT ➔ Conecte-se comigo no LinkedIn ou explore meus repositórios abaixo!
    </text>
  </g>
</svg>
