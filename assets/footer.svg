<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0e0d1f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="neonBorderFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <filter id="footGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8a2be2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .foot-title { font-weight: 800; font-size: 20px; letter-spacing: 2px; }
  </style>

  <!-- Container -->
  <rect x="5" y="5" width="940" height="130" rx="14" fill="url(#bgGradFoot)"/>
  <rect x="5" y="5" width="940" height="130" rx="14" fill="none" stroke="url(#neonBorderFoot)" stroke-width="1.8" filter="url(#footGlow)"/>

  <!-- Center Content -->
  <g transform="translate(475, 48)">
    <text x="0" y="0" text-anchor="middle" fill="#00f5d4" class="font-mono foot-title">
      EMPRESA + TALENTO = IMPACTO <tspan font-size="22">🚀</tspan>
    </text>
  </g>

  <g transform="translate(475, 82)">
    <text x="0" y="0" text-anchor="middle" fill="#cbd5e1" class="font-sans" font-size="15" font-weight="600">
      Vamos construir soluções seguras, resilientes e escaláveis juntos? Conecte-se comigo!
    </text>
  </g>

  <!-- Bottom Deco Line -->
  <line x1="150" y1="108" x2="800" y2="108" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="475" cy="108" r="3" fill="#00f5d4"/>
</svg>
