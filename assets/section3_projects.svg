      <rect x="0" y="0" width="399" height="30" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
      <text x="200" y="20" text-anchor="middle" fill="#34d399" class="btn-lbl">VER REPOSITÓRIO ➔</text>
    </g>
