    <circle cx="15" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="41" cy="14" r="4.5" fill="#10b981"/>
    <!-- Project Header -->
