    <circle cx="15" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="41" cy="14" r="4.5" fill="#10b981"/>
    <!-- Project Header -->
    <text x="60" y="18" fill="#00f5d4" class="font-mono proj-title">📱 MINI-SERVIDOR DIY MOBILE</text>

    <!-- Description -->
    <text x="18" y="52" class="font-sans proj-desc">Engenharia de hardware: transformação de smartphone Android</text>
    <text x="18" y="70" class="font-sans proj-desc">antigo em servidor Linux headless para laboratórios portáteis.</text>
    <text x="18" y="88" class="font-sans proj-desc" fill="#94a3b8" font-size="11.5">Túneis SSH criptografados, Termux e Kali NetHunter 24/7.</text>

