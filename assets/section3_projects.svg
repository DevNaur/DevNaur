    <!-- Description -->
    <text x="18" y="52" class="font-sans proj-desc">Artigo e modelagem técnica sobre isolamento de perímetro, contenção</text>
    <text x="18" y="70" class="font-sans proj-desc">e identificação de incidentes em microsserviços conteinerizados.</text>
    <text x="18" y="88" class="font-sans proj-desc" fill="#94a3b8" font-size="11.5">Mitigação de blast-radius e políticas de rede estritas.</text>

    <!-- Tags Row -->
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#0f172a" stroke="#bd00ff" stroke-width="0.8"/>
      <text x="30" y="15" text-anchor="middle" fill="#d946ef" class="tag-lbl">Docker</text>
      <rect x="68" y="0" width="105" height="22" rx="4" fill="#0f172a" stroke="#bd00ff" stroke-width="0.8"/>
      <text x="120" y="15" text-anchor="middle" fill="#d946ef" class="tag-lbl">Microsserviços</text>
      <rect x="180" y="0" width="85" height="22" rx="4" fill="#0f172a" stroke="#bd00ff" stroke-width="0.8"/>
      <text x="222" y="15" text-anchor="middle" fill="#d946ef" class="tag-lbl">Zero-Trust</text>
      <rect x="272" y="0" width="80" height="22" rx="4" fill="#0f172a" stroke="#bd00ff" stroke-width="0.8"/>
      <text x="312" y="15" text-anchor="middle" fill="#d946ef" class="tag-lbl">Segurança</text>
    </g>

