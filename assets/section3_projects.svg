      <rect x="0" y="0" width="399" height="30" rx="6" fill="#4a044e" fill-opacity="0.4" stroke="#bd00ff" stroke-width="1"/>
      <text x="200" y="20" text-anchor="middle" fill="#d946ef" class="btn-lbl">VER RESUMO / DOSSIÊ ➔</text>
    </g>
  </g>

