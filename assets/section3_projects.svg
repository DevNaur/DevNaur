      <text x="27" y="15" text-anchor="middle" fill="#00f5d4" class="tag-lbl">Linux</text>
      <rect x="62" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="0.8"/>
      <text x="94" y="15" text-anchor="middle" fill="#00f5d4" class="tag-lbl">Termux</text>
      <rect x="134" y="0" width="105" height="22" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="0.8"/>
      <text x="186" y="15" text-anchor="middle" fill="#00f5d4" class="tag-lbl">NetHunter</text>
      <rect x="246" y="0" width="85" height="22" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="0.8"/>
      <text x="288" y="15" text-anchor="middle" fill="#00f5d4" class="tag-lbl">Networking</text>
    </g>

