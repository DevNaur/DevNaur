    <!-- Description -->
    <text x="18" y="52" class="font-sans proj-desc">Módulo corporativo focado em transições de status idempotentes,</text>
    <text x="18" y="70" class="font-sans proj-desc">consistência relacional ACID e rastreabilidade para eventos acadêmicos.</text>
    <text x="18" y="88" class="font-sans proj-desc" fill="#94a3b8" font-size="11.5">Proteção contra double-spending e arquitetura MVC limpa.</text>

    <!-- Tags Row -->
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="30" y="15" text-anchor="middle" fill="#34d399" class="tag-lbl">Python</text>
      <rect x="68" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="100" y="15" text-anchor="middle" fill="#34d399" class="tag-lbl">Django</text>
      <rect x="140" y="0" width="85" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="182" y="15" text-anchor="middle" fill="#34d399" class="tag-lbl">PostgreSQL</text>
      <rect x="232" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="257" y="15" text-anchor="middle" fill="#34d399" class="tag-lbl">MVC</text>
