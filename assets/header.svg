<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0e0d1f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a2be2" flood-opacity="0.35"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8a2be2" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .hud-title { font-weight: 900; letter-spacing: 5px; }
    .hud-sub { font-weight: 700; letter-spacing: 3px; }
    .hud-tag { font-weight: 600; letter-spacing: 1px; font-size: 11px; }
  </style>

  <!-- Background Base -->
  <rect x="5" y="5" width="940" height="250" rx="14" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="940" height="250" rx="14" fill="url(#cyberGrid)"/>

  <!-- Outer HUD Frame with Cut Corners -->
  <path d="M 25 10 
           L 925 10 
           A 15 15 0 0 1 940 25 
           L 940 235 
           A 15 15 0 0 1 925 250 
           L 25 250 
           A 15 15 0 0 1 10 235 
           L 10 25 
           A 15 15 0 0 1 25 10 Z" 
        fill="none" stroke="url(#neonBorder)" stroke-width="1.8" filter="url(#boxGlow)"/>

  <!-- Cyber Tech Corner Notches -->
  <path d="M 18 10 L 40 10 M 10 18 L 10 40" stroke="#00f5d4" stroke-width="3" fill="none"/>
  <path d="M 910 10 L 932 10 M 940 18 L 940 40" stroke="#00f5d4" stroke-width="3" fill="none"/>
  <path d="M 18 250 L 40 250 M 10 220 L 10 242" stroke="#bd00ff" stroke-width="3" fill="none"/>
  <path d="M 910 250 L 932 250 M 940 220 L 940 242" stroke="#bd00ff" stroke-width="3" fill="none"/>

  <!-- Top Status Badge Pill (Right) -->
  <g transform="translate(640, 22)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0d1117" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Glowing Status Green Dot -->
    <circle cx="18" cy="14" r="5" fill="#10b981" filter="url(#neonGlow)"/>
    <circle cx="18" cy="14" r="2.5" fill="#ffffff"/>
    <text x="32" y="18" fill="#00f5d4" class="font-mono hud-tag">STATUS: OPEN FOR OPPORTUNITIES</text>
  </g>

  <!-- Top Academic Pill (Left) -->
  <g transform="translate(30, 22)">
    <text x="0" y="18" fill="#94a3b8" class="font-mono" font-size="13" font-weight="600">
      <tspan fill="#00f5d4">⚡</tspan> Engenharia de Software <tspan fill="#38bdf8">@ UNEB</tspan> (Universidade do Estado da Bahia)
    </text>
  </g>

  <!-- Horizontal Tech Divider -->
  <line x1="30" y1="58" x2="920" y2="58" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="475" cy="58" r="3" fill="#00f5d4"/>

  <!-- Center Big Name: CAICK RUAN -->
  <g transform="translate(475, 135)">
    <!-- Drop Glow Shadow of Text -->
    <text x="0" y="0" text-anchor="middle" fill="#8b5cf6" class="font-sans hud-title" font-size="56" opacity="0.6" filter="url(#neonGlow)">
      CAICK RUAN
    </text>
    <!-- Sharp Front Gradient Text -->
    <text x="0" y="0" text-anchor="middle" fill="url(#nameGrad)" class="font-sans hud-title" font-size="56">
      CAICK RUAN
    </text>
  </g>

  <!-- Subtitle: SOFTWARE ENGINEER | FULL STACK & CYBERSECURITY -->
  <g transform="translate(475, 175)">
    <text x="0" y="0" text-anchor="middle" fill="#e2e8f0" class="font-mono hud-sub" font-size="17">
      SOFTWARE ENGINEER <tspan fill="#00f5d4">|</tspan> FULL STACK <tspan fill="#bd00ff">&amp;</tspan> CYBERSECURITY
    </text>
  </g>

  <!-- Bottom HUD Clearance & Telemetry Line -->
  <line x1="30" y1="205" x2="920" y2="205" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3"/>
  
  <g transform="translate(50, 230)">
    <text x="0" y="0" fill="#64748b" class="font-mono" font-size="11">
      <tspan fill="#00f5d4">&gt;_</tspan> ZERO-TRUST PROTOCOL: <tspan fill="#10b981">ENABLED</tspan>
    </text>
  </g>

  <g transform="translate(475, 230)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" class="font-mono" font-size="11">
      <tspan fill="#bd00ff">///</tspan> DEVSECOPS &amp; DEFENSIVE ARCHITECTURE <tspan fill="#bd00ff">///</tspan>
    </text>
  </g>

  <g transform="translate(895, 230)">
    <text x="0" y="0" text-anchor="end" fill="#64748b" class="font-mono" font-size="11">
      NODE: <tspan fill="#38bdf8">UNEB-CAMPUS-II</tspan>
    </text>
  </g>
</svg>
